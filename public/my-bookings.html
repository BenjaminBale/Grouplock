<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My bookings · Grouple</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f2f5;color:#222;min-height:100vh;}
.topnav{background:#1D9E75;color:white;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;}
.topnav-brand{font-size:16px;font-weight:600;text-decoration:none;color:white;}
.topnav button{background:none;border:1px solid rgba(255,255,255,.4);color:white;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:12px;}
.topnav button:hover{background:rgba(255,255,255,.1);}
.wrap{max-width:640px;margin:24px auto;padding:0 16px;}
.card{background:white;border-radius:12px;padding:20px;border:1px solid #ddd;}
.card-title{font-size:14px;font-weight:600;margin-bottom:4px;color:#111;}
.card-sub{font-size:12px;color:#888;margin-bottom:16px;}
.booking-row{display:block;text-decoration:none;color:inherit;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid #f0f0f0;}
.booking-row:last-child{border-bottom:none;}
.booking-row:hover .booking-name{color:#0d6e52;}
.booking-name{font-size:14px;font-weight:500;}
.booking-sub{font-size:11px;color:#888;margin-top:2px;}
.status-pill{font-size:10px;padding:3px 8px;border-radius:20px;font-weight:500;white-space:nowrap;}
.status-pending{background:#fff8e6;color:#854f0b;}
.status-awaiting_merchant_approval{background:#e8ecfb;color:#2b3f9e;}
.status-complete{background:#e0f5ec;color:#0d6e52;}
.status-cancelled{background:#f5f5f5;color:#888;}
.empty{font-size:13px;color:#888;text-align:center;padding:30px 0;}
</style>
</head>
<body>
<div class="topnav">
  <a href="/" class="topnav-brand">Grouple<span style="color:#e0f5ec;">.</span></a>
  <button onclick="logout()">Log out</button>
</div>

<div class="wrap">
  <div class="card">
    <div class="card-title">My bookings</div>
    <div class="card-sub" id="email-line">Loading...</div>
    <div id="bookings-list"></div>
  </div>
</div>

<script>
async function init() {
  const meRes = await fetch('/api/guest/me');
  if (meRes.status === 401) { window.location.href = '/login.html'; return; }
  const me = await meRes.json();
  document.getElementById('email-line').textContent = me.email;

  const res = await fetch('/api/guest/bookings');
  const data = await res.json();
  const list = document.getElementById('bookings-list');

  if (!data.bookings || data.bookings.length === 0) {
    list.innerHTML = '<div class="empty">No bookings found for this email yet.</div>';
    return;
  }

  list.innerHTML = data.bookings.map(b => `
    <a class="booking-row" href="/?booking=${b.bookingId}">
      <div>
        <div class="booking-name">${b.propertyName}</div>
        <div class="booking-sub">${b.groupSize} people · £${b.totalAmount} total · ${new Date(b.createdAt).toLocaleDateString()}</div>
      </div>
      <span class="status-pill status-${b.status}">${b.status.replace(/_/g, ' ')}</span>
    </a>
  `).join('');
}

async function logout() {
  await fetch('/api/guest/logout', { method: 'POST' });
  window.location.href = '/login.html';
}

init();
</script>
</body>
</html>
