<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grouple for Business · Log in</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.card{background:white;border-radius:14px;max-width:420px;width:100%;overflow:hidden;border:1px solid #e0e0e0;}
.header{background:#1D9E75;padding:20px 24px;color:white;}
.header h2{font-size:16px;margin-bottom:4px;}
.header p{font-size:12px;opacity:.85;}
.body{padding:22px 24px;}
input{width:100%;border:1.5px solid #e0e0e0;border-radius:8px;padding:10px 12px;font-size:14px;margin-bottom:10px;outline:none;font-family:inherit;}
input:focus{border-color:#1D9E75;}
.btn{display:block;width:100%;border:none;border-radius:8px;padding:13px;font-size:14px;font-weight:500;cursor:pointer;text-align:center;margin-top:10px;background:#1D9E75;color:white;}
.btn:hover{background:#178a65;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.msg{font-size:13px;color:#0d6e52;margin-top:12px;text-align:center;display:none;}
.hint{font-size:12px;color:#888;text-align:center;margin-top:14px;}
.hint a{color:#0d6e52;}
</style>
</head>
<body>
<div class="card">
  <div class="header"><h2>Grouple for Business</h2><p>Log in to your dashboard</p></div>
  <div class="body">
    <input type="email" id="email" placeholder="Work email" />
    <button class="btn" id="login-btn" onclick="submitLogin()">Email me a login link →</button>
    <div class="msg" id="msg"></div>
    <div class="hint">New here? <a href="/merchant/signup.html">Sign up</a></div>
  </div>
</div>
<script>
async function submitLogin() {
  const btn = document.getElementById('login-btn');
  const msgEl = document.getElementById('msg');
  const email = document.getElementById('email').value.trim();
  if (!email) return;

  btn.disabled = true;
  btn.textContent = 'Sending...';

  try {
    await fetch('/api/merchant/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    });
    msgEl.textContent = 'Check your email for a login link. It expires in 15 minutes.';
    msgEl.style.display = 'block';
    btn.textContent = 'Link sent →';
  } catch (err) {
    btn.disabled = false;
    btn.textContent = 'Email me a login link →';
  }
}
</script>
</body>
</html>
