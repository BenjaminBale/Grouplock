<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grouple for Business · Sign up</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.card{background:white;border-radius:14px;max-width:440px;width:100%;overflow:hidden;border:1px solid #e0e0e0;}
.header{background:#1D9E75;padding:20px 24px;color:white;}
.header h2{font-size:16px;margin-bottom:4px;}
.header p{font-size:12px;opacity:.85;}
.body{padding:22px 24px;}
input{width:100%;border:1.5px solid #e0e0e0;border-radius:8px;padding:10px 12px;font-size:14px;margin-bottom:10px;outline:none;font-family:inherit;}
input:focus{border-color:#1D9E75;}
.btn{display:block;width:100%;border:none;border-radius:8px;padding:13px;font-size:14px;font-weight:500;cursor:pointer;text-align:center;margin-top:10px;background:#1D9E75;color:white;}
.btn:hover{background:#178a65;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.error{color:#c0392b;font-size:12px;margin-top:6px;padding:8px;background:#fef5f5;border-radius:6px;display:none;}
.hint{font-size:12px;color:#888;text-align:center;margin-top:14px;}
.hint a{color:#0d6e52;}
</style>
</head>
<body>
<div class="card">
  <div class="header"><h2>Grouple for Business</h2><p>Set up group payments for your properties</p></div>
  <div class="body">
    <input type="text" id="business-name" placeholder="Business name" />
    <input type="email" id="email" placeholder="Work email" />
    <button class="btn" id="signup-btn" onclick="submitSignup()">Continue to connect Stripe →</button>
    <div class="error" id="error"></div>
    <div class="hint">By continuing, you agree to Grouple's <a href="/terms.html" target="_blank">Terms</a> and <a href="/privacy.html" target="_blank">Privacy Policy</a>.</div>
    <div class="hint">Already have an account? <a href="/merchant/login.html">Log in</a></div>
  </div>
</div>
<script>
async function submitSignup() {
  const btn = document.getElementById('signup-btn');
  const errorEl = document.getElementById('error');
  errorEl.style.display = 'none';

  const businessName = document.getElementById('business-name').value.trim();
  const email = document.getElementById('email').value.trim();
  if (!businessName || !email) {
    errorEl.textContent = 'Please enter your business name and email.';
    errorEl.style.display = 'block';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Setting up...';

  try {
    const res = await fetch('/api/merchant/signup', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ businessName, email })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    window.location.href = data.onboardingUrl;
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Continue to connect Stripe →';
  }
}
</script>
</body>
</html>
