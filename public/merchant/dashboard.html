<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grouple for Business · Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f2f5;color:#222;min-height:100vh;}
.topnav{background:#003580;color:white;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;}
.topnav-brand{font-size:15px;font-weight:500;}
.topnav-brand span{color:#febb02;}
.topnav button{background:none;border:1px solid rgba(255,255,255,.4);color:white;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:12px;}
.topnav button:hover{background:rgba(255,255,255,.1);}
.wrap{max-width:760px;margin:24px auto;padding:0 16px;}
.card{background:white;border-radius:12px;padding:20px;border:1px solid #ddd;margin-bottom:16px;}
.card-title{font-size:14px;font-weight:600;margin-bottom:12px;color:#111;}
.connect-banner{background:#fff8e6;border:1px solid #f3d98b;border-radius:8px;padding:14px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
.connect-banner p{font-size:13px;color:#854f0b;}
.badge-connected{font-size:11px;background:#e0f5ec;color:#0d6e52;padding:4px 10px;border-radius:20px;font-weight:500;}
.btn{border:none;border-radius:8px;padding:10px 16px;font-size:13px;font-weight:500;cursor:pointer;background:#1D9E75;color:white;white-space:nowrap;}
.btn:hover{background:#178a65;}
.btn-small{padding:6px 12px;font-size:12px;}
.btn-danger{background:white;color:#c0392b;border:1.5px solid #f0c4bc;}
.btn-danger:hover{background:#fef5f5;}
pre{background:#f9f9f9;border:1px solid #eee;border-radius:8px;padding:12px;font-size:11px;overflow-x:auto;white-space:pre-wrap;word-break:break-all;}
.booking-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #f0f0f0;}
.booking-row:last-child{border-bottom:none;}
.booking-name{font-size:13px;font-weight:500;}
.booking-sub{font-size:11px;color:#888;margin-top:2px;}
.status-pill{font-size:10px;padding:3px 8px;border-radius:20px;font-weight:500;}
.status-pending{background:#fff8e6;color:#854f0b;}
.status-complete{background:#e0f5ec;color:#0d6e52;}
.status-cancelled{background:#f5f5f5;color:#888;}
.empty{font-size:13px;color:#888;text-align:center;padding:20px 0;}
</style>
</head>
<body>
<div class="topnav">
  <div class="topnav-brand">Grouple<span>.</span> for Business</div>
  <button onclick="logout()">Log out</button>
</div>

<div class="wrap">
  <div class="card">
    <div class="card-title" id="business-name">Loading...</div>
    <div id="connect-status"></div>
  </div>

  <div class="card">
    <div class="card-title">Your embed snippet</div>
    <p style="font-size:12px;color:#666;margin-bottom:10px;">Paste this on any property page. Replace the property name, total, and currency for each listing.</p>
    <pre id="snippet"></pre>
  </div>

  <div class="card">
    <div class="card-title">Bookings in progress</div>
    <div id="bookings-list"></div>
  </div>
</div>

<script>
let merchant = null;

async function init() {
  const res = await fetch('/api/merchant/me');
  if (res.status === 401) { window.location.href = '/merchant/login.html'; return; }
  merchant = await res.json();

  document.getElementById('business-name').textContent = merchant.businessName;
  renderConnectStatus();
  renderSnippet();
  loadBookings();
}

function renderConnectStatus() {
  const el = document.getElementById('connect-status');
  if (merchant.stripeOnboardingComplete) {
    el.innerHTML = '<span class="badge-connected">✓ Stripe connected — payments route to your account</span>';
  } else {
    el.innerHTML = `
      <div class="connect-banner">
        <p>Finish connecting Stripe to start receiving payments.</p>
        <button class="btn btn-small" onclick="connectStripe()">Connect Stripe →</button>
      </div>`;
  }
}

async function connectStripe() {
  const res = await fetch('/api/merchant/stripe/connect', { method: 'POST' });
  const data = await res.json();
  if (data.onboardingUrl) window.location.href = data.onboardingUrl;
}

function renderSnippet() {
  const snippet = `<div id="grouple-widget"></div>
<script src="${window.location.origin}/embed.js"
  data-merchant-key="${merchant.embedKey}"
  data-property-name="Your Property Name"
  data-total-amount="2000.00"
  data-currency="gbp"><\/script>`;
  document.getElementById('snippet').textContent = snippet;
}

async function loadBookings() {
  const res = await fetch('/api/merchant/bookings');
  const data = await res.json();
  const list = document.getElementById('bookings-list');

  if (!data.bookings || data.bookings.length === 0) {
    list.innerHTML = '<div class="empty">No bookings yet. They\'ll show up here once guests start a group payment through your embed.</div>';
    return;
  }

  list.innerHTML = data.bookings.map(b => `
    <div class="booking-row">
      <div>
        <div class="booking-name">${b.propertyName}</div>
        <div class="booking-sub">${b.paidCount}/${b.groupSize} paid · £${b.shareAmount} each · £${b.totalAmount} total</div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;">
        <span class="status-pill status-${b.status}">${b.status}</span>
        ${b.status === 'pending' ? `<button class="btn btn-small btn-danger" onclick="markUnavailable('${b.bookingId}', this)">Mark unavailable</button>` : ''}
      </div>
    </div>
  `).join('');
}

async function markUnavailable(bookingId, btn) {
  if (!confirm('This refunds everyone who has paid and cancels the booking. Are you sure?')) return;
  btn.disabled = true;
  btn.textContent = 'Cancelling...';
  try {
    const res = await fetch('/api/merchant/bookings/' + bookingId + '/mark-unavailable', { method: 'POST' });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    loadBookings();
  } catch (err) {
    alert('Error: ' + err.message);
    btn.disabled = false;
    btn.textContent = 'Mark unavailable';
  }
}

async function logout() {
  await fetch('/api/merchant/logout', { method: 'POST' });
  window.location.href = '/merchant/login.html';
}

init();
</script>
</body>
</html>
